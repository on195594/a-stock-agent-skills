name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install uv==0.11.14
      - run: uv sync --frozen
      - name: Install current owner package
        run: |
          git clone --depth 1 https://github.com/on195594/a-stock-lib.git /tmp/a-stock-lib
          uv pip install --python .venv/bin/python /tmp/a-stock-lib
      - run: A_STOCK_LIB_SOURCE=/tmp/a-stock-lib bash scripts/check.sh
